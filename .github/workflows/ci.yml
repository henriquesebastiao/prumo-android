name: CI

# Every push to main and every pull request into it: the checks CLAUDE.md asks of every change
# ("Testes e qualidade"), short of the comparison with the server and the design, which is done by hand.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its run in progress; every push to main gets its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # The runner image has the Android SDK and its licenses; the Android Gradle plugin downloads
      # the platform and build tools the build asks for (compileSdk 37, build tools 37.0.0).

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Only main writes the Gradle cache; pull requests read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The quick checks first, so a formatting slip fails in a minute.
      - name: Formatting (Spotless) and static analysis (detekt)
        run: ./gradlew spotlessCheck detekt --stacktrace

      # Compile, unit tests (JVM and Robolectric) and Android lint. --continue reports every
      # module's failures in one run.
      - name: Build
        run: ./gradlew build --continue --stacktrace

      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
