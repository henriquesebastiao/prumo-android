org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# KSP's incremental runs left :feature:finance's debug output (and its build cache entry) with only
# the files of the last change, so Hilt lost the module's @IntoSet binding and the app shipped
# without Finanças. Full KSP runs are a few seconds per module.
ksp.incremental=false
