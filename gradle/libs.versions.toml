[versions]
# Checked on 2026-11-04: Google Maven (AndroidX release notes), Maven Central and the Gradle Plugin
# Portal. Check the current stable versions again before bumping one; don't guess.
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
hilt = "2.60.1"
androidxHilt = "1.4.0"
composeBom = "2026.09.00"
# The BOM pins material3 1.4.0, without FloatingToolbar, ButtonGroup, LoadingIndicator, ToggleButton and
# SegmentedListItem. Fixed to the beta until 1.5 is stable (docs/decisoes.md, D03).
material3 = "1.5.0-beta02"
material3Adaptive = "1.3.0"
navigation3 = "1.2.0"
lifecycle = "2.11.0"
activity = "1.13.0"
coreKtx = "1.19.1"
splashscreen = "1.2.0"
# Kotlin port of material-color-utilities: the tonal-spot schemes of the app and of each module.
materialColorUtilities = "6.0.0"
datastore = "1.3.0"
tink = "1.24.0"
# Book covers in Livros, loaded through the session's OkHttp client. Checked on Maven Central 2026-11-09.
coil = "3.6.3"
okhttp = "5.5.1"
retrofit = "3.0.0"
serialization = "1.12.0"
coroutines = "1.11.0"
detekt = "1.23.8"
composeRules = "0.6.8"
spotless = "8.11.0"
ktlint = "1.8.0"
junit = "4.13.2"
turbine = "1.2.1"
mockk = "1.14.11"
robolectric = "4.17"
paging = "3.5.3"
# The cache of the server's answers (Fase 4). Checked on Google Maven 2026-11-09.
room = "2.8.5"
androidxTestJunit = "1.3.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
material-color-utilities = { module = "com.materialkolor:material-color-utilities", version.ref = "materialColorUtilities" }
androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "paging" }
androidx-paging-compose = { module = "androidx.paging:paging-compose", version.ref = "paging" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
